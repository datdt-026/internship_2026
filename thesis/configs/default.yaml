# Default experiment config — survival scope (text + image, late fusion)
project:
  name: vaccine-misinfo-multimodal
  seed: 42
  output_dir: results
  checkpoint_dir: checkpoints

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  source: constraint_covid_fake_news
  text_column: text
  image_column: image_path
  label_column: label
  # Binary for speed; switch to 3-class if labels support it
  label_map:
    credible: 0
    misinfo: 1
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  max_text_length: 256
  # 0 is safer on macOS / MPS
  num_workers: 0

model:
  modality: text  # text | image | fusion
  text_encoder: roberta-base
  image_encoder: openai/clip-vit-base-patch32
  freeze_image_encoder: true
  fusion: late  # late concat + MLP
  dropout: 0.2
  num_labels: 2

train:
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 5
  early_stopping_patience: 2
  fp16: false
  gradient_accumulation_steps: 1
  logging_steps: 50
  save_total_limit: 2

eval:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
  average: macro

topics:
  enabled: false
  min_topic_size: 15
  top_n_topics: 10
